name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sitewatch_ci
          POSTGRES_PASSWORD: sitewatch_ci_test_only
          POSTGRES_DB: sitewatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sitewatch_ci -d sitewatch_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://sitewatch_ci:sitewatch_ci_test_only@127.0.0.1:5432/sitewatch_test
      TEST_DATABASE_URL: postgresql+psycopg://sitewatch_ci:sitewatch_ci_test_only@127.0.0.1:5432/sitewatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: sitewatch migrate
      - run: python -m ruff check backend tests
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev
